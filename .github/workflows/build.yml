name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project & Compile APK
        run: |
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/user_main.dart
          elif [ -f "lib/Main.dart" ]; then
            cp lib/Main.dart /tmp/user_main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/user_main.dart
          elif [ -f "Main.dart" ]; then
            cp Main.dart /tmp/user_main.dart
          else
            echo "Error: main.dart not found!"
            exit 1
          fi

          mkdir -p /tmp/pocketledger_app
          cd /tmp/pocketledger_app
          flutter create --org com.kwik3h --project-name pocketledger --platforms android .
          sed -i 's/android:label="pocketledger"/android:label="PocketLedger"/g' android/app/src/main/AndroidManifest.xml
          cp /tmp/user_main.dart lib/main.dart
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/PocketLedger.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PocketLedger Android APK (Build #${{ github.run_number }})
          files: PocketLedger.apk
          
